/* ── 책 검색 (Google Books) ── */
async function searchBooks(q) {
  const results = [];
  const seen = new Set();

  // 1) 카카오 책 검색 (한국 책에 강함)
  try {
    const r = await fetch(`https://dapi.kakao.com/v3/search/book?query=${encodeURIComponent(q)}&size=12`, {
      headers: { Authorization: "KakaoAK 6d81533b7da989741f560eaf202aa511" }
    });
    const j = await r.json();
    (j.documents || []).forEach(d => {
      const key = d.title + (d.authors||[]).join("");
      if (seen.has(key)) return;
      seen.add(key);
      results.push({
        olId: "kakao_" + d.isbn,
        title: d.title || "",
        author: (d.authors || []).join(", "),
        publisher: d.publisher || "",
        year: d.datetime ? d.datetime.slice(0,4) : "",
        cover: d.thumbnail || null,
      });
    });
  } catch(e) {}

  // 2) Google Books (보완용)
  try {
    const r2 = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8&printType=books&orderBy=relevance`);
    const j2 = await r2.json();
    (j2.items || []).forEach(item => {
      const info = item.volumeInfo || {};
      const key = (info.title||"") + (info.authors||[]).join("");
      if (seen.has(key)) return;
      seen.add(key);
      const cover = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || null;
      results.push({
        olId: item.id,
        title: info.title || "",
        author: (info.authors || []).join(", "),
        publisher: info.publisher || "",
        year: info.publishedDate ? info.publishedDate.slice(0,4) : "",
        cover: cover ? cover.replace("http://","https://") : null,
      });
    });
  } catch(e) {}

  return results;
}

  const [data, setData]             = useState(load);

  const [filter, setFilter]         = useState("all");

  const [searchQ, setSearchQ]       = useState("");
  const [searchRes, setSearchRes]   = useState([]);
  const [searching, setSrching]     = useState(false);
  const [pending, setPending]       = useState(null);
  const [noteModal, setNoteModal]   = useState(false);
  const [editNote, setEditNote]     = useState(null);
  const [vocabModal, setVocabModal] = useState(false);
  const [editVocab, setEditVocab]   = useState(null);
  const timer = useRef(null);

  useEffect(() => persist(data), [data]);

  const newPending = (title="") => ({title,author:"",publisher:"",year:"",cover:null,status:"reading",currentPage:"",totalPages:"",emotion:EMOTIONS[0],notes:[],startedAt:new Date().toISOString(),pageHistory:[],finishedAt:null,addedAt:new Date().toISOString()});

  const handleSearch = q => {
    setSearchQ(q); clearTimeout(timer.current);
    if (!q.trim()) { setSearchRes([]); return; }
    timer.current = setTimeout(async()=>{setSrching(true);setSearchRes(await searchBooks(q));setSrching(false);},500);
  };

  const pickBook = b => { setPending({...newPending(b.title),author:b.author,publisher:b.publisher,year:b.year,cover:b.cover,olId:b.olId}); setAddStep(2); };

  const confirmAdd = () => {
    if(!pending)return;
    const book = {...pending, id:Date.now()};
    setData(d=>({...d,books:[book,...d.books]}));
    setView("home"); setAddStep(1); setSearchQ(""); setSearchRes([]); setPending(null);
  };

  const saveNote = note => {
    const book = selBook;
    const updatedNotes = editNote
      ? book.notes.map(n=>n.id===editNote.id?{...n,...note,editedAt:new Date().toISOString()}:n)
      : [{...note,id:Date.now(),createdAt:new Date().toISOString()},...book.notes];
    const updated = {...book,notes:updatedNotes};
    setData(d=>({...d,books:d.books.map(b=>b.id===book.id?updated:b)}));
    setSelBook(updated); setNoteModal(false); setEditNote(null);
  };

  const delNote = id => {
    const updated = {...selBook,notes:selBook.notes.filter(n=>n.id!==id)};
    setData(d=>({...d,books:d.books.map(b=>b.id===selBook.id?updated:b)}));
    setSelBook(updated);
  };

  const updBook = (id,upd) => {
    setData(d=>({...d,books:d.books.map(b=>b.id===id?{...b,...upd}:b)}));
    if(selBook?.id===id) setSelBook(p=>({...p,...upd}));
  };

  const recordPage = (id, page, total) => {
    const book = data.books.find(b=>b.id===id);
    const entry = {page,total,date:new Date().toISOString()};
    const isFinished = total && Number(page)>=Number(total);
    const updated = {...book,currentPage:page,totalPages:total,pageHistory:[...(book.pageHistory||[]),entry],...(isFinished&&book.status!=="done"?{status:"done",finishedAt:new Date().toISOString()}:{})};
    setData(d=>({...d,books:d.books.map(b=>b.id===id?updated:b)}));
    if(selBook?.id===id) setSelBook(updated);
  };

  const delBook = id => {
    setData(d=>({...d,books:d.books.filter(b=>b.id!==id)}));
    setView("home"); setSelBook(null);
  };

  const saveVocab = v => {
    setData(d=>({...d,vocab:editVocab
      ? d.vocab.map(w=>w.id===editVocab.id?{...w,...v}:w)
      : [{...v,id:Date.now(),createdAt:new Date().toISOString()},...d.vocab]
    }));
    setVocabModal(false); setEditVocab(null);
  };

  const delVocab = id => setData(d=>({...d,vocab:d.vocab.filter(w=>w.id!==id)}));

  const filtered = data.books.filter(b=>filter==="all"?true:filter==="reading"?b.status==="reading":b.status==="done");
  const goAdd = ()=>{setView("add");setAddStep(1);setPending(null);setSearchQ("");setSearchRes([]);};
  const goDetail = b=>{setSelBook(b);setView("detail");};
  const goHome = ()=>{setView("home");setSelBook(null);};

  return (
    <div style={S.root}>
      <nav style={S.nav}>
        <button onClick={goHome} style={S.brand} className="brand-title">BOOKITORY</button>
        <div style={S.navR}>
          <button style={S.navLink} onClick={()=>setView("vocab")}>단어장</button>
          <button style={S.navLink} onClick={()=>setView("backup")}>백업</button>
          <button style={S.pill} onClick={goAdd}>+ 추가</button>
        </div>
      </nav>

      {view==="home"&&(
        <main style={{...S.main}} className="main-content">
          <div style={S.statsBar}>
            {[[data.books.filter(b=>b.status==="reading").length,"읽는 중",C.accentText],[data.books.filter(b=>b.status==="done").length,"완독",C.olive],[data.books.length,"전체",C.text],[data.vocab.length,"단어",C.textMid]].map(([n,l,c],i,a)=>(
              <div key={l} style={{display:"flex",alignItems:"center",flex:1}}>
                <div style={S.statCell}><span style={{...S.statNum,color:c}}>{n}</span><span style={S.statLabel}>{l}</span></div>
                {i<a.length-1&&<div style={S.statDiv}/>}
              </div>
            ))}
          </div>
          <div style={S.filterRow}>
            {[["all","전체"],["reading","읽는 중"],["done","완독"]].map(([k,l])=><button key={k} style={{...S.filterBtn,...(filter===k?S.filterActive:{})}} onClick={()=>setFilter(k)}>{l}</button>)}
          </div>
          {filtered.length===0?(
            <div style={S.empty}><div style={{fontSize:40}}>📚</div><p style={{color:C.textMid,fontFamily:F}}>아직 책이 없어요</p><button style={S.pill} onClick={goAdd}>첫 책 추가하기</button></div>
          ):(
            <div style={S.grid} className="book-grid">
              {filtered.map(b=>(
                <div key={b.id} style={S.card} className="book-card" onClick={()=>goDetail(b)}>
                  <div style={{...S.cardCover,background:b.emotion?.color||C.pink}}>
                    {b.cover?<img src={b.cover} alt="" style={S.covImg}/>:<span style={{fontSize:30}}>📖</span>}
                    {b.status==="done"&&<div style={S.donePill}>완독 ✓</div>}
                  </div>
                  <div style={S.cardBody}>
                    <div style={S.cardTitle}>{b.title}</div>
                    <div style={S.cardAuthor}>{b.author}</div>
                    {b.totalPages&&b.currentPage&&b.status==="reading"&&(()=>{const pct=Math.min(100,Math.round(Number(b.currentPage)/Number(b.totalPages)*100));const meta=getMetaphor(pct);return(<div><div style={{display:"flex",alignItems:"center",gap:4,marginTop:6}}><span style={{fontSize:13}}>{meta.icon}</span><div style={{flex:1}}><div style={S.bar}><div style={{...S.barFill,width:`${pct}%`,background:b.emotion?.color||C.accent}}/></div><span style={S.pct}>{pct}%</span></div></div></div>);})()}
                    {b.emotion&&<div style={S.emoRow}><span style={{...S.dot,background:b.emotion.color}}/><span style={S.emoLabel}>{b.emotion.name}</span></div>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </main>
      )}

      {view==="detail"&&selBook&&<BookDetail book={selBook} onBack={goHome} onUpdate={updBook} onDel={delBook} onRecordPage={recordPage} onAddNote={()=>{setEditNote(null);setNoteModal(true);}} onEditNote={n=>{setEditNote(n);setNoteModal(true);}} onDelNote={delNote}/>}

      {view==="add"&&(
        <main style={S.main} className="main-content">
          <SubHeader title="책 추가" onBack={goHome}/>
          {addStep===1&&(
            <>
              <div style={S.searchWrap}>
                <span style={{color:C.textSoft,fontSize:16}}>🔍</span>
                <input style={S.searchInput} placeholder="제목이나 저자 검색..." value={searchQ} onChange={e=>handleSearch(e.target.value)} autoFocus/>
              </div>
              {searching&&<p style={S.hint}>검색 중...</p>}
              {searchRes.map((r,i)=>(
                <div key={i} style={S.resItem} className="hover-card" onClick={()=>pickBook(r)}>
                  <CoverThumb src={r.cover}/>
                  <div><div style={S.resTitle}>{r.title}</div><div style={S.resMeta}>{r.author}</div><div style={S.resMeta}>{[r.publisher,r.year&&r.year+"년"].filter(Boolean).join(" · ")}</div></div>
                </div>
              ))}
              {searchQ&&!searching&&<button style={S.ghost} onClick={()=>{setPending(newPending(searchQ));setAddStep(2);}}>✏️ 직접 입력하기</button>}
            </>
          )}
          {addStep===2&&pending&&<AddForm book={pending} onChange={setPending} onBack={()=>setAddStep(1)} onConfirm={confirmAdd}/>}
        </main>
      )}

      {view==="vocab"&&(
        <main style={S.main} className="main-content">
          <SubHeader title="단어장" onBack={goHome} right={<button style={S.pill} onClick={()=>{setEditVocab(null);setVocabModal(true);}}>+ 추가</button>}/>
          {data.vocab.length===0?(
            <div style={S.empty}><div style={{fontSize:40}}>📝</div><p style={{color:C.textMid,fontFamily:F}}>모르는 단어를 기록해보세요</p></div>
          ):(
            data.vocab.map(w=>(
              <div key={w.id} style={S.vocabCard}>
                <div style={S.vocabWord}>{w.word}</div>
                {w.meaning&&<div style={S.vocabMeaning}>{w.meaning}</div>}
                {w.example&&<div style={S.vocabEx}>"{w.example}"</div>}
                {w.bookTitle&&<div style={S.vocabSrc}>📖 {w.bookTitle}</div>}
                <div style={{...S.row,marginTop:6}}>
                  <Chip onClick={()=>{setEditVocab(w);setVocabModal(true);}}>편집</Chip>
                  <Chip danger onClick={()=>delVocab(w.id)}>삭제</Chip>
                </div>
              </div>
            ))
          )}
        </main>
      )}

      {view==="backup"&&<BackupView books={data.books} vocab={data.vocab} onBack={goHome} onRestore={restored=>{setData(restored);goHome();}}/>}

      {noteModal&&<NoteModal initial={editNote} onSave={saveNote} onClose={()=>{setNoteModal(false);setEditNote(null);}}/>}
      {vocabModal&&<VocabModal initial={editVocab} books={data.books} onSave={saveVocab} onClose={()=>{setVocabModal(false);setEditVocab(null);}}/>}
    </div>
  );
}

function BookDetail({book,onBack,onUpdate,onDel,onRecordPage,onAddNote,onEditNote,onDelNote}) {
  const [editPage,setEditPage]=useState(false);
  const [curIn,setCurIn]=useState(book.currentPage||"");
  const [totIn,setTotIn]=useState(book.totalPages||"");
  const [showEmo,setShowEmo]=useState(false);
  const [confDel,setConfDel]=useState(false);
  const [showHist,setShowHist]=useState(false);
  const pct=book.totalPages&&book.currentPage?Math.min(100,Math.round(Number(book.currentPage)/Number(book.totalPages)*100)):null;
  const meta=pct!==null?getMetaphor(pct):null;

  return (
    <main style={S.main} className="main-content">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <button onClick={onBack} style={S.back}>← 뒤로</button>
        <div style={S.row}>
          <button style={{...S.toggleBtn,...(book.status==="done"?{background:C.accentBg,color:C.accentText,borderColor:C.accent}:{})}}
            onClick={()=>onUpdate(book.id,{status:book.status==="done"?"reading":"done",...(book.status!=="done"?{finishedAt:new Date().toISOString()}:{finishedAt:null})})}>
            {book.status==="done"?"✓ 완독":"완독 표시"}
          </button>
          <Chip danger onClick={()=>setConfDel(true)}>삭제</Chip>
        </div>
      </div>

      <div style={S.detailTop}>
        <div style={{...S.detailCov,background:book.emotion?.color||C.pink}}>
          {book.cover?<img src={book.cover} alt="" style={S.covImg}/>:<span style={{fontSize:34}}>📖</span>}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <h1 style={S.dtTitle}>{book.title}</h1>
          <p style={S.dtAuthor}>{book.author}</p>
          {book.publisher&&<p style={S.dtMeta}>{book.publisher}</p>}
          {book.year&&<p style={S.dtMeta}>{book.year}년</p>}
          <div style={{position:"relative",marginTop:8}}>
            <button style={S.emoBtn} onClick={()=>setShowEmo(!showEmo)}>
              <span style={{...S.dot,width:11,height:11,background:book.emotion?.color}}/>{book.emotion?.name||"감정 선택"}
            </button>
            {showEmo&&(
              <div style={S.emoPicker}>
                {EMOTIONS.map(e=>(
                  <div key={e.color} style={S.emoPickItem} className="hover-card" onClick={()=>{onUpdate(book.id,{emotion:e});setShowEmo(false);}}>
                    <span style={{...S.dot,width:13,height:13,background:e.color}}/>
                    <div><div style={{fontSize:12,color:C.text,fontWeight:500,fontFamily:F}}>{e.name}</div><div style={{fontSize:10,color:C.textMid,fontFamily:F}}>{e.mood}</div></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>

      <div style={S.timelineBox}>
        <div style={S.timelineTitle}>📅 독서 여정</div>
        <div style={S.timeline}>
          <TLItem icon="🌱" label="시작" date={fmtDate(book.startedAt)} active={!!book.startedAt}/>
          <div style={S.tlLine}/>
          <TLItem icon="📖" label="마지막" date={book.pageHistory?.length?fmtDate(book.pageHistory[book.pageHistory.length-1].date):"—"} sub={book.currentPage?`${book.currentPage}쪽`:""} active={!!(book.pageHistory?.length)}/>
          <div style={S.tlLine}/>
          <TLItem icon="🌟" label="완독" date={fmtDate(book.finishedAt)||"—"} active={!!book.finishedAt}/>
        </div>
        {book.pageHistory?.length>0&&<button style={S.histBtn} onClick={()=>setShowHist(!showHist)}>{showHist?"접기 ▲":"기록 보기 ▼"} ({book.pageHistory.length}회)</button>}
        {showHist&&<div style={S.histList}>{[...(book.pageHistory||[])].reverse().map((h,i)=><div key={i} style={S.histItem}><span style={S.histPage}>{h.page}쪽</span>{h.total&&<span style={S.histPct}>{Math.round(Number(h.page)/Number(h.total)*100)}%</span>}<span style={S.histDate}>{fmtFull(h.date)}</span></div>)}</div>}
      </div>

      <div style={S.progressBox}>
        {editPage?(
          <div>
            <div style={{...S.row,flexWrap:"nowrap"}}>
              <input style={S.pageInp} type="number" placeholder="현재" value={curIn} onChange={e=>setCurIn(e.target.value)} autoFocus/>
              <span style={{color:C.textSoft}}>/</span>
              <input style={S.pageInp} type="number" placeholder="전체" value={totIn} onChange={e=>setTotIn(e.target.value)}/>
              <button style={S.pill} onClick={()=>{onRecordPage(book.id,curIn,totIn);setEditPage(false);}}>저장</button>
            </div>
            <button style={{...S.ghostSm,marginTop:8,fontSize:12}} onClick={()=>setEditPage(false)}>취소</button>
          </div>
        ):(
          <div style={{cursor:"pointer"}} onClick={()=>setEditPage(true)}>
            {book.currentPage?<span style={{fontSize:15,color:C.textMid}}><b style={{color:C.text,fontSize:22}}>{book.currentPage}</b> / {book.totalPages||"?"} 쪽 <span style={{fontSize:11,color:C.textSoft}}>탭해서 업데이트</span></span>:<span style={{fontSize:13,color:C.textSoft}}>쪽수를 기록해보세요 →</span>}
          </div>
        )}
        {meta&&pct!==null&&(
          <div style={S.metaphorBox}>
            <div style={S.metaphorTop}>
              <span style={S.metaphorIco}>{meta.icon}</span>
              <div><div style={S.metaphorLabel}>{meta.label}</div><div style={S.metaphorSub}>{meta.sub}</div></div>
              <span style={S.metaphorPct}>{pct}%</span>
            </div>
            <div style={S.bigBar}><div style={{...S.bigBarFill,width:`${pct}%`,background:book.emotion?.color||C.accent}}>{pct>10&&<span style={S.barLabel}>{pct}%</span>}</div></div>
          </div>
        )}
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <span style={S.secTitle}>기록</span>
        <button style={S.pill} onClick={onAddNote}>+ 추가</button>
      </div>
      {(!book.notes||!book.notes.length)&&<p style={S.hint}>문장이나 느낌을 기록해보세요</p>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {(book.notes||[]).map(n=>(
          <div key={n.id} style={{...S.noteCard,borderLeft:`3px solid ${book.emotion?.color||C.accent}`}}>
            <span style={{fontSize:10,color:C.textSoft}}>{n.type==="sentence"?"📌 문장":"💭 느낌"}</span>
            <p style={S.noteText}>{n.text}</p>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{n.page&&<span style={S.noteMeta}>p.{n.page}</span>}<span style={S.noteMeta}>{fmtFull(n.createdAt)}{n.editedAt?" (편집됨)":""}</span></div>
            <div style={{...S.row,marginTop:5}}><Chip onClick={()=>onEditNote(n)}>편집</Chip><Chip danger onClick={()=>onDelNote(n.id)}>삭제</Chip></div>
          </div>
        ))}
      </div>

      {confDel&&<Overlay><div style={{...S.modal,borderRadius:8}}><p style={{fontWeight:700,color:C.text,marginBottom:14,fontFamily:F}}>이 책을 삭제할까요?</p><div style={S.row}><button style={{...S.pill,background:C.danger,color:"#fff",border:"none",boxShadow:"none",flex:1,justifyContent:"center"}} onClick={()=>onDel(book.id)}>삭제</button><button style={{...S.ghostSm,flex:1,textAlign:"center"}} onClick={()=>setConfDel(false)}>취소</button></div></div></Overlay>}
    </main>
  );
}

function AddForm({book,onChange,onBack,onConfirm}) {
  const handleImgUpload = e => {
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>onChange({...book,cover:ev.target.result});
    reader.readAsDataURL(file);
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <button style={S.back} onClick={onBack}>← 검색으로</button>
      <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
        <div style={{display:"flex",flexDirection:"column",gap:5,paddingTop:18}}>
          <div style={{...S.detailCov,width:80,minWidth:80,height:118,background:book.emotion?.color||C.pink}}>
            {book.cover?<img src={book.cover} alt="" style={S.covImg}/>:<span style={{fontSize:24}}>📖</span>}
          </div>
          <label style={{display:"block",textAlign:"center",fontSize:10,color:C.textMid,cursor:"pointer",border:`1.5px dashed ${C.border}`,borderRadius:3,padding:"5px 0",width:80,fontFamily:F,fontWeight:600,minHeight:32}}>
            사진 선택<input type="file" accept="image/*" style={{display:"none"}} onChange={handleImgUpload}/>
          </label>
          {book.cover&&<button style={{fontSize:10,color:C.danger,background:"none",border:"none",cursor:"pointer",fontFamily:F}} onClick={()=>onChange({...book,cover:null})}>제거</button>}
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:8}}>
          {[["제목","title"],["저자","author"],["출판사","publisher"],["출판년도","year"]].map(([l,k])=>(
            <div key={k}><div style={S.fLabel}>{l}</div><input style={S.inp} value={book[k]} onChange={e=>onChange({...book,[k]:e.target.value})}/></div>
          ))}
        </div>
      </div>
      <div><div style={S.fLabel}>읽기 상태</div><div style={S.row}>{[["reading","읽는 중"],["done","완독"]].map(([k,l])=><button key={k} style={{...S.filterBtn,...(book.status===k?S.filterActive:{})}} onClick={()=>onChange({...book,status:k})}>{l}</button>)}</div></div>
      <div>
        <div style={S.fLabel}>감정 색상</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:5}}>
          {EMOTIONS.map(e=><div key={e.color} title={e.name} style={{width:30,height:30,borderRadius:"50%",background:e.color,cursor:"pointer",outline:book.emotion?.color===e.color?`3px solid ${C.text}`:"none",outlineOffset:2}} onClick={()=>onChange({...book,emotion:e})}/>)}
        </div>
        {book.emotion&&<div style={{fontSize:11,color:C.textMid,marginTop:5,fontFamily:F}}>{book.emotion.name} — {book.emotion.mood}</div>}
      </div>
      <button style={{...S.pill,width:"100%",padding:"14px",fontSize:15,fontWeight:700}} onClick={onConfirm}>책장에 추가하기</button>
    </div>
  );
}

function NoteModal({initial,onSave,onClose}) {
  const [type,setType]=useState(initial?.type||"sentence");
  const [text,setText]=useState(initial?.text||"");
  const [page,setPage]=useState(initial?.page||"");
  return <Overlay><div style={S.modal}><div style={S.modalTitle}>{initial?"기록 편집":"새 기록"}</div><div style={{...S.row,marginBottom:10}}>{[["sentence","📌 문장"],["feeling","💭 느낌"]].map(([k,l])=><button key={k} style={{...S.filterBtn,...(type===k?S.filterActive:{})}} onClick={()=>setType(k)}>{l}</button>)}</div><textarea style={S.textarea} placeholder={type==="sentence"?"밑줄 친 문장...":"느낀 점..."} value={text} onChange={e=>setText(e.target.value)} autoFocus/><input style={{...S.inp,marginTop:8}} type="number" placeholder="쪽수 (선택)" value={page} onChange={e=>setPage(e.target.value)}/><div style={{...S.row,marginTop:12}}><button style={S.pill} onClick={()=>text.trim()&&onSave({type,text,page})}>저장</button><button style={S.ghostSm} onClick={onClose}>취소</button></div></div></Overlay>;
}

function VocabModal({initial,books,onSave,onClose}) {
  const [word,setWord]=useState(initial?.word||"");
  const [meaning,setMeaning]=useState(initial?.meaning||"");
  const [example,setExample]=useState(initial?.example||"");
  const [bookTitle,setBT]=useState(initial?.bookTitle||"");
  return (
    <Overlay>
      <div style={S.modal}>
        <div style={S.modalTitle}>{initial?"단어 편집":"단어 추가"}</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div><div style={S.fLabel}>단어 <span style={{color:C.danger}}>*</span></div><input style={S.inp} placeholder="단어" value={word} onChange={e=>setWord(e.target.value)} autoFocus/></div>
          <div><div style={S.fLabel}>뜻 <span style={{color:C.textSoft,fontWeight:400}}>(나중에 추가 가능)</span></div><input style={S.inp} placeholder="뜻" value={meaning} onChange={e=>setMeaning(e.target.value)}/></div>
          <div><div style={S.fLabel}>예문 <span style={{color:C.textSoft,fontWeight:400}}>(선택)</span></div><input style={S.inp} placeholder="예문" value={example} onChange={e=>setExample(e.target.value)}/></div>
          <div><div style={S.fLabel}>출처 책</div><select style={S.inp} value={bookTitle} onChange={e=>setBT(e.target.value)}><option value="">선택 안함</option>{books.map(b=><option key={b.id} value={b.title}>{b.title}</option>)}</select></div>
        </div>
        <div style={{...S.row,marginTop:12}}>
          <button style={S.pill} onClick={()=>word.trim()&&onSave({word,meaning,example,bookTitle})} disabled={!word.trim()}>저장</button>
          <button style={S.ghostSm} onClick={onClose}>취소</button>
        </div>
      </div>
    </Overlay>
  );
}

function BackupView({books,vocab,onBack,onRestore}) {
  const [restoreFile,setRestoreFile]=useState(null);
  const [restoreMsg,setRestoreMsg]=useState("");
  const [copied,setCopied]=useState(false);
  const makeBackup=()=>JSON.stringify({version:1,exportedAt:new Date().toISOString(),books,vocab},null,2);
  const downloadBackup=()=>{const blob=new Blob([makeBackup()],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`bookitory_mobile_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);};
  const copyBackup=async()=>{await navigator.clipboard.writeText(makeBackup());setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const handleRestore=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed.books||!parsed.vocab)throw new Error();setRestoreFile(parsed);setRestoreMsg(`📦 책 ${parsed.books.length}권, 단어 ${parsed.vocab.length}개 — ${parsed.exportedAt?.slice(0,10)||""}`);}catch{setRestoreMsg("❌ 올바른 백업 파일이 아니에요.");setRestoreFile(null);}};reader.readAsText(file);};
  return (
    <main style={S.main} className="main-content">
      <SubHeader title="백업 / 복구" onBack={onBack}/>
      <div style={S.sectionPaper}>
        <div style={{...S.secTitle,marginBottom:10}}>📤 백업</div>
        <div style={{fontSize:12,color:C.textMid,marginBottom:12,fontFamily:F}}>책 <b>{books.length}권</b>, 단어 <b>{vocab.length}개</b></div>
        <button style={S.backupBtn} onClick={downloadBackup}>⬇ JSON 파일 다운로드</button>
        <button style={{...S.backupBtn,...(copied?{background:C.accentBg,color:C.accentText}:{})}} onClick={copyBackup}>{copied?"✓ 복사됨!":"📋 클립보드 복사"}</button>
      </div>
      <div style={S.sectionPaper}>
        <div style={{...S.secTitle,marginBottom:10}}>📥 복구</div>
        <div style={{fontSize:12,color:C.textMid,marginBottom:12,fontFamily:F}}>백업 JSON 파일을 선택하면 현재 데이터가 교체돼요.</div>
        <label style={S.fileLabel}>파일 선택<input type="file" accept=".json" style={{display:"none"}} onChange={handleRestore}/></label>
        {restoreMsg&&<div style={{marginTop:10,fontSize:12,color:C.textMid,whiteSpace:"pre-line",background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:3,padding:"8px 12px",fontFamily:F}}>{restoreMsg}</div>}
        {restoreFile&&<button style={{...S.backupBtn,marginTop:10,background:C.accent,color:C.accentText,border:`1.5px solid ${C.accentText}`,boxShadow:`2px 2px 0 ${C.accentText}`}} onClick={()=>{if(window.confirm("현재 데이터가 백업 파일로 교체돼요. 계속할까요?"))onRestore(restoreFile);}}>이 파일로 복구하기</button>}
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
